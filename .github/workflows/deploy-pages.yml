name: Deploy ISP Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage frontend-only artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R css _site/css
          cp -R js _site/js
          cp -R assets _site/assets
          # Every deployment gets a unique runtime asset version so browsers cannot reuse stale JS.
          sed -i "s/const BUILD_VERSION = '[^']*';/const BUILD_VERSION = '${GITHUB_SHA}';/" _site/js/app.js
          test -f _site/index.html
          test -d _site/css
          test -d _site/js
          test -d _site/assets
          test ! -e _site/backend
          test ! -e _site/database
          test ! -e _site/.github
          test ! -e _site/.devcontainer

      - name: Configure frontend API endpoint
        env:
          ISP_API_BASE_URL: ${{ vars.ISP_API_BASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlparse

          base_url = os.environ.get("ISP_API_BASE_URL", "").strip().rstrip("/")
          if base_url:
              parsed = urlparse(base_url)
              if not parsed.netloc or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
                  raise SystemExit("ISP_API_BASE_URL must be an origin, e.g. https://api.example.com")
              if parsed.scheme != "https" and parsed.hostname not in ("localhost", "127.0.0.1"):
                  raise SystemExit("ISP_API_BASE_URL must use HTTPS outside localhost")
          config_path = "_site/js/api-config.js"
          with open(config_path, encoding="utf-8") as handle:
              source = handle.read()
          updated, count = re.subn(r"baseUrl:\s*''", "baseUrl: " + json.dumps(base_url), source, count=1)
          if count != 1:
              raise SystemExit("Could not locate the frontend baseUrl configuration")
          with open(config_path, "w", encoding="utf-8") as handle:
              handle.write(updated)
          print("Frontend API endpoint: " + (base_url or "unconfigured (safe demo/offline mode)"))
          PY

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
