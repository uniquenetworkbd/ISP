name: Deploy ISP Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage frontend-only artifact
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          cp -R css _site/css
          cp -R js _site/js
          cp -R assets _site/assets
          # Every deployment gets a unique runtime asset version so browsers cannot reuse stale JS.
          sed -i "s/const BUILD_VERSION = '[^']*';/const BUILD_VERSION = '${GITHUB_SHA}';/" _site/js/app.js
          test -f _site/index.html
          test -d _site/css
          test -d _site/js
          test -d _site/assets
          test ! -e _site/backend
          test ! -e _site/database
          test ! -e _site/.github
          test ! -e _site/.devcontainer

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
